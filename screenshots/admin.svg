<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <filter id="adminShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="480" fill="#f8fafc"/>

  <!-- Admin Main Container -->
  <rect x="25" y="25" width="550" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#adminShadow)"/>

  <!-- Admin Header -->
  <rect x="25" y="25" width="550" height="60" rx="18" fill="#0f172a"/>
  <text x="50" y="60" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">CAMPUS CONNECT — ADMIN PORTAL</text>
  <rect x="440" y="42" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="495" y="59" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#10b981">● SYSTEM ACTIVE</text>

  <!-- Analytics Metric Cards Row -->
  <g transform="translate(45, 105)">
    <!-- Metric 1: Total Users -->
    <rect x="0" y="0" width="115" height="74" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="14" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#3b82f6">TOTAL USERS</text>
    <text x="14" y="55" font-family="sans-serif" font-size="22" font-weight="800" fill="#1e3a8a">1,420</text>

    <!-- Metric 2: Total Posts -->
    <rect x="130" y="0" width="115" height="74" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="144" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#10b981">TOTAL POSTS</text>
    <text x="144" y="55" font-family="sans-serif" font-size="22" font-weight="800" fill="#065f46">3,892</text>

    <!-- Metric 3: Likes/Comments -->
    <rect x="260" y="0" width="115" height="74" rx="12" fill="#fdf4ff" stroke="#f5d0fe"/>
    <text x="274" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#a855f7">ENGAGEMENTS</text>
    <text x="274" y="55" font-family="sans-serif" font-size="22" font-weight="800" fill="#701a75">18.4K</text>

    <!-- Metric 4: Spam Reports -->
    <rect x="390" y="0" width="115" height="74" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="404" y="25" font-family="sans-serif" font-size="11" font-weight="700" fill="#ef4444">REPORTS</text>
    <text x="404" y="55" font-family="sans-serif" font-size="22" font-weight="800" fill="#991b1b">7</text>
  </g>

  <!-- Content Moderation Section Title -->
  <text x="50" y="215" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#0f172a">MODERATION &amp; REPORTED CONTENT</text>
  
  <!-- Moderation Table Frame -->
  <g transform="translate(45, 230)">
    <rect width="510" height="205" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    
    <!-- Table Header -->
    <rect width="510" height="32" rx="12" fill="#f1f5f9"/>
    <text x="16" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">USER</text>
    <text x="130" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">FLAGGED CONTENT</text>
    <text x="320" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">REPORTS</text>
    <text x="420" y="21" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">ACTION</text>

    <!-- Row 1 -->
    <line x1="0" y1="32" x2="510" y2="32" stroke="#e2e8f0"/>
    <text x="16" y="56" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">user_491</text>
    <text x="130" y="56" font-family="sans-serif" font-size="11" fill="#475569">Spam promotional link ...</text>
    <text x="320" y="56" font-family="sans-serif" font-size="11" font-weight="700" fill="#ef4444">4 flags</text>
    <rect x="420" y="42" width="60" height="22" rx="6" fill="#fee2e2"/>
    <text x="450" y="57" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">Delete</text>

    <!-- Row 2 -->
    <line x1="0" y1="75" x2="510" y2="75" stroke="#e2e8f0"/>
    <text x="16" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">test_bot2</text>
    <text x="130" y="100" font-family="sans-serif" font-size="11" fill="#475569">Repeated commercial post ...</text>
    <text x="320" y="100" font-family="sans-serif" font-size="11" font-weight="700" fill="#ef4444">3 flags</text>
    <rect x="420" y="86" width="60" height="22" rx="6" fill="#fee2e2"/>
    <text x="450" y="101" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#dc2626">Delete</text>

    <!-- Row 3 -->
    <line x1="0" y1="120" x2="510" y2="120" stroke="#e2e8f0"/>
    <text x="16" y="145" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">guest_88</text>
    <text x="130" y="145" font-family="sans-serif" font-size="11" fill="#475569">Duplicate comment spam ...</text>
    <text x="320" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">2 flags</text>
    <rect x="420" y="131" width="60" height="22" rx="6" fill="#f1f5f9"/>
    <text x="450" y="146" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">Review</text>

    <!-- Row 4 Notice -->
    <line x1="0" y1="165" x2="510" y2="165" stroke="#e2e8f0"/>
    <text x="255" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#94a3b8">
      Showing 3 active reports • System auto-quarantines above 5 flags
    </text>
  </g>
</svg>
