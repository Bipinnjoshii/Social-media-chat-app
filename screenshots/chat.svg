<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="chatShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="480" fill="#f8fafc"/>

  <!-- Chat Container -->
  <rect x="25" y="25" width="550" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#chatShadow)"/>

  <!-- Left Sidebar (Conversations) -->
  <rect x="25" y="25" width="190" height="430" rx="18" fill="#ffffff"/>
  <line x1="215" y1="25" x2="215" y2="455" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Conversations Header -->
  <text x="42" y="58" font-family="-apple-system, sans-serif" font-size="15" font-weight="800" fill="#0f172a">Messages</text>
  <rect x="42" y="72" width="155" height="28" rx="14" fill="#f1f5f9"/>
  <text x="65" y="90" font-family="sans-serif" font-size="11" fill="#94a3b8">Search chats...</text>

  <!-- User 1 (Active) -->
  <rect x="32" y="112" width="175" height="52" rx="10" fill="#eff6ff"/>
  <circle cx="58" cy="138" r="16" fill="#3b82f6"/>
  <text x="58" y="142" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">AK</text>
  <circle cx="70" cy="150" r="4" fill="#10b981"/>
  <text x="82" y="133" font-family="sans-serif" font-size="12" font-weight="700" fill="#0f172a">Aarav Kumar</text>
  <text x="82" y="148" font-family="sans-serif" font-size="10" fill="#64748b">Are you coming to...</text>

  <!-- User 2 -->
  <circle cx="58" cy="188" r="16" fill="#ec4899"/>
  <text x="58" y="192" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">SP</text>
  <circle cx="70" cy="200" r="4" fill="#10b981"/>
  <text x="82" y="183" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Sneha Patel</text>
  <text x="82" y="198" font-family="sans-serif" font-size="10" fill="#94a3b8">Loved your new post!</text>

  <!-- User 3 -->
  <circle cx="58" cy="238" r="16" fill="#10b981"/>
  <text x="58" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">RM</text>
  <circle cx="70" cy="250" r="4" fill="#94a3b8"/>
  <text x="82" y="233" font-family="sans-serif" font-size="12" font-weight="600" fill="#334155">Rohan Mehta</text>
  <text x="82" y="248" font-family="sans-serif" font-size="10" fill="#94a3b8">Sent an attachment</text>

  <!-- Right Chat Area -->
  <!-- Chat Top Bar -->
  <rect x="215" y="25" width="360" height="54" fill="#ffffff"/>
  <line x1="215" y1="79" x2="575" y2="79" stroke="#e2e8f0" stroke-width="1"/>
  
  <circle cx="245" cy="52" r="16" fill="#3b82f6"/>
  <text x="245" y="56" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">AK</text>
  <text x="272" y="48" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Aarav Kumar</text>
  <text x="272" y="62" font-family="sans-serif" font-size="10" fill="#10b981">● Online (Real-time Socket)</text>

  <!-- Chat History Area -->
  <rect x="215" y="79" width="360" height="320" fill="#f8fafc"/>

  <!-- Incoming Message 1 -->
  <rect x="235" y="105" width="220" height="42" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="247" y="130" font-family="sans-serif" font-size="11" fill="#1e293b">Hey Bipin! Check out the new project.</text>
  <text x="235" y="157" font-family="sans-serif" font-size="9" fill="#94a3b8">10:14 AM</text>

  <!-- Outgoing Message 1 -->
  <rect x="335" y="170" width="220" height="44" rx="14" fill="url(#bubbleGrad)"/>
  <text x="347" y="196" font-family="sans-serif" font-size="11" fill="#ffffff">Looks awesome! Socket messages are super fast.</text>
  <text x="515" y="224" font-family="sans-serif" font-size="9" fill="#94a3b8">10:15 AM</text>

  <!-- Incoming Message 2 -->
  <rect x="235" y="238" width="235" height="56" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="247" y="260" font-family="sans-serif" font-size="11" fill="#1e293b">Also tested notifications and dark mode,</text>
  <text x="247" y="278" font-family="sans-serif" font-size="11" fill="#1e293b">everything works smoothly!</text>
  <text x="235" y="306" font-family="sans-serif" font-size="9" fill="#94a3b8">10:16 AM</text>

  <!-- Outgoing Message 2 -->
  <rect x="350" y="320" width="205" height="42" rx="14" fill="url(#bubbleGrad)"/>
  <text x="362" y="345" font-family="sans-serif" font-size="11" fill="#ffffff">Thanks bro! Pushing the updates now.</text>
  <text x="515" y="372" font-family="sans-serif" font-size="9" fill="#94a3b8">10:17 AM</text>

  <!-- Chat Input Bar -->
  <rect x="215" y="399" width="360" height="56" fill="#ffffff"/>
  <line x1="215" y1="399" x2="575" y2="399" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="235" y="411" width="280" height="32" rx="16" fill="#f1f5f9"/>
  <text x="250" y="431" font-family="sans-serif" font-size="11" fill="#94a3b8">Write a message...</text>
  <circle cx="538" cy="427" r="14" fill="#6366f1"/>
  <polygon points="533,421 546,427 533,433" fill="#ffffff"/>
</svg>
