[build]
  base    = "client"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION          = "18"
  NODE_OPTIONS          = "--openssl-legacy-provider"
  CI                    = "false"
  GENERATE_SOURCEMAP    = "false"
  DISABLE_ESLINT_PLUGIN = "true"
  ESLINT_NO_DEV_ERRORS  = "true"
  REACT_APP_API_URL     = "https://campus-connect-api-obe8.onrender.com"

[[redirects]]
  from   = "/api/*"
  to     = "https://campus-connect-api-obe8.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
