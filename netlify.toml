[build]
  base    = "client"
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION       = "18"
  NODE_OPTIONS       = "--openssl-legacy-provider"
  CI                 = "false"
  GENERATE_SOURCEMAP = "false"
  # Set REACT_APP_API_URL to your Render backend URL in Netlify dashboard
  # Example: https://campus-connect-api.onrender.com

[[redirects]]
  from   = "/api/*"
  to     = ":splat"
  status = 200
  force  = false

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
